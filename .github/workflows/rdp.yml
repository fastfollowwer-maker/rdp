name: Ultimate-1D-Counter-No Script

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      
      # -----------------------------------------------------------
      # خطوة 1: تثبيت المتطلبات الأساسية وتعديل إعدادات النظام
      # -----------------------------------------------------------
      - name: Install Prerequisites & Configure Network
        shell: pwsh
        run: |
          Write-Host "⬇️ Downloading Chrome..."
          Invoke-WebRequest -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" -OutFile "chrome_installer.exe"
          Start-Process -FilePath "chrome_installer.exe" -Args "/silent /install" -Wait
          
          Write-Host "⬇️ Downloading CRD Host..."
          Invoke-WebRequest -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" -OutFile "crd.msi"
          Start-Process -FilePath "msiexec.exe" -Args "/i crd.msi /quiet /qn" -Wait

          # تعطيل أي إعدادات بروكسي قديمة في ويندوز لضمان الاتصال المباشر
          Write-Host "🌐 Cleaning up Windows Proxy settings..."
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings' -Name ProxyEnable -Value 0

      # -----------------------------------------------------------
      # خطوة 2: تفعيل الريموت ديسكتوب
      # -----------------------------------------------------------
      - name: Start Chrome Remote Desktop
        shell: pwsh
        env:
          CR_CODE: ${{ secrets.CRD_CODE }}
          CR_PIN: ${{ secrets.CRD_PIN }}
        run: |
          $exePath = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          $UniqueName = "${{ github.actor }}-Machine"
          
          Write-Host "🚀 STARTING RDP SERVICE: $UniqueName"
          & $exePath --code="$env:CR_CODE" --redirect-url="https://remotedesktop.google.com/_/oauthredirect" --name="$UniqueName" --pin=$env:CR_PIN

      # -----------------------------------------------------------
      # خطوة 3: البقاء
      # -----------------------------------------------------------
      - name: Keep Alive
        shell: pwsh
        run: |
          Write-Host "✅ VM is running smoothly..."
          while ($true) { Start-Sleep -Seconds 300 }
